# Every push to main becomes a release: the next patch version after the
# latest v* tag (v0.1.0 -> v0.1.1 -> ...), with the commits since that tag as
# release notes. A commit that already carries a v* tag (e.g. a manual minor
# bump) is released under that tag instead of a new one.
#
# The Docker image is built in the same workflow: releases created with the
# workflow's GITHUB_TOKEN don't trigger other workflows, so a separate
# "on: release" workflow would never run.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          set -euo pipefail
          if tag=$(git describe --exact-match --tags --match 'v*' HEAD 2>/dev/null); then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)
          else
            previous=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
            IFS=. read -r major minor patch <<< "${previous#v}"
            echo "tag=v${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          range="${PREVIOUS:+$PREVIOUS..}HEAD"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            echo "## Docker"
            echo
            echo '```'
            echo "docker pull ghcr.io/2tap2b/nexote:${TAG#v}"
            echo '```'
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

  # One native runner per architecture (arm64 under QEMU emulation took ~5
  # minutes for the Next.js build alone), pushed by digest, then merged into
  # one multi-arch tag by the merge job.
  docker:
    needs: release
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names
        id: names
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/2tap2b/nexote,push-by-digest=true,name-canonical=true,push=true
          # Settings > About shows these (the build context has no .git).
          build-args: |
            NEXOTE_VERSION=${{ needs.release.outputs.tag }}
            NEXOTE_COMMIT=${{ steps.names.outputs.short }}
          cache-from: type=gha,scope=${{ steps.names.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.names.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: [release, docker]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/2tap2b/nexote
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("ghcr.io/2tap2b/nexote@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Check the image
        run: docker buildx imagetools inspect "ghcr.io/2tap2b/nexote:${{ steps.meta.outputs.version }}"
