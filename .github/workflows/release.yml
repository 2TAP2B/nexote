# Pushing a v* tag creates its release, with the commits since the previous
# v* tag as release notes. Pushes to main alone release nothing: each change
# request becomes a minor release (v0.6.0), bugfixes a patch (v0.6.1).
#
# The Docker image and the Android APK are built in the same workflow:
# releases created with the workflow's GITHUB_TOKEN don't trigger other
# workflows, so a separate "on: release" workflow would never run.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          range="${PREVIOUS:+$PREVIOUS..}HEAD"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            echo "## Docker"
            echo
            echo '```'
            echo "docker pull ghcr.io/2tap2b/nexote:${TAG#v}"
            echo '```'
            echo
            echo "## Android"
            echo
            echo "The APK is attached to this release (nexote-${TAG#v}.apk)."
            echo "Obtainium: add https://github.com/2TAP2B/nexote to get updates."
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

  # One native runner per architecture (arm64 under QEMU emulation took ~5
  # minutes for the Next.js build alone), pushed by digest, then merged into
  # one multi-arch tag by the merge job.
  docker:
    needs: release
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names
        id: names
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/2tap2b/nexote,push-by-digest=true,name-canonical=true,push=true
          # Settings > About shows these (the build context has no .git).
          build-args: |
            NEXOTE_VERSION=${{ needs.release.outputs.tag }}
            NEXOTE_COMMIT=${{ steps.names.outputs.short }}
          cache-from: type=gha,scope=${{ steps.names.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.names.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: [release, docker]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/2tap2b/nexote
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("ghcr.io/2tap2b/nexote@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Check the image
        run: docker buildx imagetools inspect "ghcr.io/2tap2b/nexote:${{ steps.meta.outputs.version }}"

  # The Android app (android/): the frontend export and the Go engine,
  # bound with gomobile, in a WebView shell. Attached to the release as
  # nexote-<version>.apk, signed with the release key from the secrets.
  android:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Same pnpm as the Dockerfile.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build the engine
        env:
          # Settings > About shows these (as in the Docker build).
          NEXOTE_VERSION: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # The runner image has the SDK in ANDROID_HOME and several NDKs.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          export NEXOTE_COMMIT="${GITHUB_SHA::7}"
          android/build-engine.sh

      - name: Build the APK
        working-directory: android
        env:
          TAG: ${{ needs.release.outputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NEXOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Without the key Gradle would quietly build an unsigned APK.
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          export NEXOTE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          base64 --decode <<< "$KEYSTORE_BASE64" > "$NEXOTE_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease -PnexoteVersion="${TAG#v}"

      - name: Check the signature
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -d "$build_tools" ]]; then
            build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          fi
          "$build_tools/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          apk="nexote-${TAG#v}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber
