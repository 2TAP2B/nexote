# Every push to main becomes a release: the next patch version after the
# latest v* tag (v0.1.0 -> v0.1.1 -> ...), with the commits since that tag as
# release notes. A commit that already carries a v* tag (e.g. a manual minor
# bump) is released under that tag instead of a new one.
#
# The Docker image is built in the same workflow: releases created with the
# workflow's GITHUB_TOKEN don't trigger other workflows, so a separate
# "on: release" workflow would never run.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          set -euo pipefail
          if tag=$(git describe --exact-match --tags --match 'v*' HEAD 2>/dev/null); then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)
          else
            previous=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
            IFS=. read -r major minor patch <<< "${previous#v}"
            echo "tag=v${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          range="${PREVIOUS:+$PREVIOUS..}HEAD"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            echo "## Docker"
            echo
            echo '```'
            echo "docker pull ghcr.io/2tap2b/nexote:${TAG#v}"
            echo '```'
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/2tap2b/nexote
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Settings > About shows these (the build context has no .git).
          build-args: |
            NEXOTE_VERSION=${{ needs.release.outputs.tag }}
            NEXOTE_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
