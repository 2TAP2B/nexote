services:
  nexote:
    # Prebuilt multi-arch image from GitHub (every release is published).
    # Pin a version with NEXOTE_TAG in .env (e.g. NEXOTE_TAG=0.1.0).
    # Update: docker compose pull && docker compose up -d
    image: ghcr.io/2tap2b/nexote:${NEXOTE_TAG:-latest}
    # Building from source instead: docker compose up -d --build
    # Version shown in Settings › About (the build context has no .git):
    #   NEXOTE_VERSION=$(git describe --tags --abbrev=0) NEXOTE_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
    build:
      context: .
      args:
        NEXOTE_VERSION: ${NEXOTE_VERSION:-}
        NEXOTE_COMMIT: ${NEXOTE_COMMIT:-}
    container_name: nexote
    ports:
      # Single public port — Next proxies /api/* to the backend inside the
      # container, so only 3000 needs to be mapped. Uncomment 8080 to hit the
      # Go API directly.
      - "3000:3000"
      # - "8080:8080"
    volumes:
      # Notes are stored under NEXOTE_HOME (/data/nexote). Persist across
      # container recreations. If the data dir must be owned by a specific UID,
      # override user: -UUID -GUID alongside a bind mount we create and chown.
      - nexote-data:/data/nexote
    environment:
      NEXOTE_HOME: /data/nexote
      NEXOTE_PORT: "8080"
      NEXOTE_BACKEND_URL: http://127.0.0.1:8080
      PORT: "3000"
      # The address you open Nexote at (your domain behind the reverse
      # proxy). Passkeys are bound to its host name, so it must be https on a
      # domain (not an IP). Set it in a .env file next to this one:
      #   NEXOTE_PUBLIC_URL=https://notes.example.com
      NEXOTE_PUBLIC_URL: ${NEXOTE_PUBLIC_URL:-http://localhost:3000}
    restart: unless-stopped

volumes:
  nexote-data: