<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed for launchers that mask the icon (Android adaptive icons,
       the launch screen circle, iOS corners): the document is scaled into the
       safe zone, the central circle with 40% radius. Renders
       icon-maskable-512.png and apple-touch-icon.png. -->
  <rect width="512" height="512" fill="#1a1d29"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <rect x="128" y="80" width="256" height="352" rx="24" fill="none" stroke="#7c6ff0" stroke-width="16"/>
    <line x1="176" y1="160" x2="336" y2="160" stroke="#7c6ff0" stroke-width="12" stroke-linecap="round"/>
    <line x1="176" y1="220" x2="336" y2="220" stroke="#5c5f6b" stroke-width="12" stroke-linecap="round"/>
    <line x1="176" y1="280" x2="336" y2="280" stroke="#5c5f6b" stroke-width="12" stroke-linecap="round"/>
    <line x1="176" y1="340" x2="272" y2="340" stroke="#5c5f6b" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
